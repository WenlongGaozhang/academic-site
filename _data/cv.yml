    Experience:
      - company: University of Essex
        position: Lecturer (Assistant Professor) in Robotics and AI
        location: Colchester, UK
        start_date: 2026-03
        end_date: ""
        summary: School of Computer Science and Electronic Engineering, Robotics and Embedded Systems group.
        highlights:
          - Lead the "Embodied AI and Compliant Manipulation" research theme, embedding multimodal foundation models into variable-stiffness soft robotic hardware.
          - Teach Robotics (CE215-5-SP, 120+ undergraduates) and Embedded Systems Programming (CE865-7-AU, 40+ postgraduates); lead the redesign of both modules.
          - Supervise 1 fully-funded PhD candidate (second supervisor, at interview/selection stage), 3 MSc students, and 6 undergraduate research projects.
          - Serve as a university Academic Misconduct Panel member and on the department's Athena Swan committee; personal tutor for undergraduates.
          - Maintain collaborations with UCL Computer Science, UCL Mechanical Engineering, Imperial College London's Hamlyn Centre, TU Munich, and Stevens Institute of Technology, with industry/clinical translation links to the Port of London Authority and UCL Hospitals (UCLH).

      - company: University College London (UCL)
        position: Senior Research Fellow / Research Fellow
        location: London, UK
        start_date: 2024-03
        end_date: 2026-03
        summary: EPSRC-funded project (EP/Y000862/1, £800K+ total award) on autonomous underwater exploration and manipulation, with Dr. Yuanchang Liu (Associate Professor, UCL Mechanical Engineering).
        highlights:
          - Developed an embedded AI control framework for a bio-inspired modular variable-stiffness manipulator, enabling safe, compliant underwater operation in unstructured environments.
          - Results submitted to Science Robotics and presented at ICRA 2026 (Vienna).

      - company: University College London (UCL)
        position: Research Assistant
        location: London, UK
        start_date: 2022-09
        end_date: 2024-03
        summary: Co-Investigator and systems-engineering lead on the "SoftSensation" interdisciplinary clinical-engineering project, with Dr. Sara Adela Abad G., Prof. Helge Wurdemann (UCL), and Prof. Martin Koltzenburg (UCL Hospitals).
        highlights:
          - Led development of a soft, hand-worn haptic force-feedback device used in a neuropathy-diagnosis clinical trial at UCL Hospitals, iterating on mechanical design and control.
          - Work covered by The Times, Sky News, and the Financial Times.

